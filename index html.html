<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Biodata Rekan</title>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700&display=swap" rel="stylesheet">
  <style>
    body {
      margin: 0;
      padding: 0;
      background: linear-gradient(120deg, #89f7fe, #66a6ff);
      font-family: 'Montserrat', sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }
    .card {
      background: #ffffff;
      padding: 30px 40px;
      border-radius: 20px;
      box-shadow: 0 8px 20px rgba(0,0,0,0.2);
      text-align: center;
      width: 90%;
      max-width: 450px;
      animation: fadeIn 1s ease-in-out;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: scale(0.9); }
      to { opacity: 1; transform: scale(1); }
    }
    .profile-pic {
      width: 140px;
      height: 140px;
      border-radius: 50%;
      object-fit: cover;
      border: 4px solid #66a6ff;
      margin-bottom: 20px;
    }
    h1 {
      font-size: 28px;
      color: #333;
      margin-bottom: 10px;
    }
    .info {
      text-align: left;
      margin: 8px 0;
      font-size: 16px;
    }
    .info strong {
      display: inline-block;
      width: 110px;
      color: #555;
    }
    .social {
      margin-top: 20px;
    }
    .social a {
      text-decoration: none;
      background: #66a6ff;
      color: white;
      padding: 10px 25px;
      border-radius: 25px;
      font-weight: bold;
      transition: background 0.3s;
    }
    .social a:hover {
      background: #4a90e2;
    }
  </style>
</head>
<body>

<div class="card">
  <img src="foto.jpg" alt="Foto Rekan" class="profile-pic">
  <h1>Biodata</h1>
  <div class="info"><strong>Nama:</strong> Indah Triayu Siboro </div>
  <div class="info"><strong>TTL:</strong> Medan , 24 Oktober 2004 </div>
  <div class="info"><strong>Alamat:</strong> jl.Merapi ujung, Panorama </div>
  <div class="info"><strong>Pekerjaan:</strong> Mahasiswa </div>
  <div class="info"><strong>Hobi:</strong> Memasak </div>
  <div class="info"><strong>Makanan Favorit:</strong> Mie ayam </div>
  <div class="social">
    <a href="https://www.instagram.com/indahtriayu_o/profilecard/?igsh=MTJ0dDl0azI2bmZqNQ==" target="_blank">Instagram</a>
  </div>
</div>

</body>
</html>
